<p>Form values : {{formInputs() | json}}</p>

<form [formGroup]="loginForm" (ngSubmit)="login()" method="post">
    <input type="text" formControlName="name"><br><br>
    <input type="email" formControlName="email"><br><br>
    <input type="password" formControlName="password"><br><br>
    <button>Submit</button>
    <button (click)="ResetForm()">Reset</button>
</form>
