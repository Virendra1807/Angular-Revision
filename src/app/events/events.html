<main>
    <p>events works!</p>

    <input type="text" (input)="handleAutoComplete($event)" (change)="handleOnChange($event)" />

    <select name="carType" (change)="HandleDropDownChnage($event)">
        <option value="NA">-</option>
        <option value="Car">Car</option>
        <option value="Bike">Bike</option>
    </select>

    <div class="div1" (mouseenter)="handleMouseEnter()">

    </div>
    <div id="div2" (mouseleave)="handleMouseLeave()">

    </div>

    <button class="btn btn-success" [disabled]="disableProperty">Check</button>
    <button class="btn btn-success" (click)="toggleBtn()">toggle</button>

    <br />
    <br />
    <label for="">Model Binding - 2 way Binding</label>
    <br />
    <input type="text" [(ngModel)]="name">
    <h1>{{name}}</h1>

</main>
